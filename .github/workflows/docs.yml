name: Build documentation

on:
  push:
    branches: [ develop ]
    paths:
      - 'docs/RF_PROTOCOL_*.md'
      - 'tools/build_protocol_pdfs.py'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Canonical generated artifacts: bilingual RF PDFs plus GNU license texts.
# The PR job always runs so it can be configured as a required status check.
# Generated artifacts are committed only on develop.
permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: pip install reportlab
      - name: Generate protocol PDFs
        run: python tools/build_protocol_pdfs.py
      - name: Install canonical GNU license texts
        if: github.event_name != 'pull_request'
        run: |
          curl -fsSL https://www.gnu.org/licenses/lgpl-3.0.txt -o LICENSE
          curl -fsSL https://www.gnu.org/licenses/gpl-3.0.txt -o COPYING
      - name: Verify generated documentation on pull requests
        if: github.event_name == 'pull_request'
        run: |
          test -s docs/Davis_RF_Protocol_Guide_IT_v1.0.pdf
          test -s docs/Davis_RF_Protocol_Guide_EN_v1.0.pdf
      - name: Commit generated documentation and license texts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all -- docs/*.pdf LICENSE COPYING)" ]; then
            echo "Generated files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/*.pdf LICENSE COPYING
          git commit -m "Build protocol PDFs and license texts"
          git push origin HEAD:develop
